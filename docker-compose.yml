version: "3.8"

services:
  mongo:
    image: mongo:6
    container_name: local-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0"]
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?directConnection=true
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongo
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moyo-be
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - MONGO_URL=mongodb://mongo:27017/moyo?directConnection=true&replicaSet=rs0
    env_file:
      - .env
    depends_on:
      - mongo
    networks:
      - app-network
    volumes:
      # Mount public folder for persistent uploads
      - ./public:/app/public

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
