version: "3.8"

services:
  mongo:
    image: mongo:6
    container_name: local-mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0"]
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - app-network-dev

  mongo-express:
    image: mongo-express
    container_name: mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?directConnection=true
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongo
    networks:
      - app-network-dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: moyo-be-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/?directConnection=true&replicaSet=rs0
    env_file:
      - .env
    depends_on:
      - mongo
    networks:
      - app-network-dev
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./public:/app/public
      # Use named volumes for node_modules to avoid conflicts
      - /app/node_modules

volumes:
  mongo_data_dev:

networks:
  app-network-dev:
    driver: bridge
